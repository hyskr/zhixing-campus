[package]
name = "zhixing-campus"
version = "0.11.1"
description = "北京交通大学校园信息桌面客户端"
edition = "2021"

[lib]
name = "zhixing_campus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["cookies", "json", "charset", "stream", "multipart"] }
reqwest_cookie_store = "0.9"
cookie_store = "0.22"
scraper = "0.24"
regex = "1"
chrono = { version = "0.4", features = ["clock", "serde"] }
base64 = "0.22"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "sync"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

