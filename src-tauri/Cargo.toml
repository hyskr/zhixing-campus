[package]
name = "zhixing-campus"
version = "0.14.1"
description = "北京交通大学校园信息客户端"
edition = "2021"

[lib]
name = "zhixing_campus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest_cookie_store = "0.9"
cookie_store = "0.22"
scraper = "0.24"
regex = "1"
chrono = { version = "0.4", features = ["clock", "serde"] }
base64 = "0.22"
keyring = "3"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "sync"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"

[target.'cfg(not(target_os = "android"))'.dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
reqwest = { version = "0.12", features = ["cookies", "json", "charset", "stream", "multipart"] }
keyring = { version = "3", features = ["apple-native", "windows-native"] }
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "json", "charset", "stream", "multipart"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }


# https://v2.tauri.app/zh-cn/concept/size/
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
