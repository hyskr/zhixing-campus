name: Desktop packages

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
            artifact: windows-x64
          - name: macOS Apple Silicon
            runner: macos-14
            target: aarch64-apple-darwin
            bundles: app,dmg
            artifact: macos-arm64
          - name: macOS Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
            artifact: macos-x64
          - name: Linux x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            artifact: linux-x64
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      APPLE_SIGNING_IDENTITY: '-'
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev libdbus-1-dev patchelf

      - name: Install pinned tools
        uses: jdx/mise-action@v5

      - name: Check tag matches application version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          bun -e '
            const versions = [
              (await Bun.file("package.json").json()).version,
              (await Bun.file("src-tauri/tauri.conf.json").json()).version,
              Bun.TOML.parse(await Bun.file("src-tauri/Cargo.toml").text()).package.version,
            ];
            if (!versions.every(version => `v${version}` === process.env.GITHUB_REF_NAME)) {
              throw new Error(`Tag ${process.env.GITHUB_REF_NAME} does not match package.json, tauri.conf.json and Cargo.toml: ${versions.join(", ")}`);
            }
          '

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
          cache-on-failure: true

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Check and test frontend
        if: github.event_name == 'pull_request'
        run: |
          bun run check
          bun run test

      - name: Test Rust
        if: github.event_name == 'pull_request' && runner.os == 'Linux'
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib --target ${{ matrix.target }}

      - name: Build bundled CLI
        run: |
          bun run build
          cargo build --release --locked --manifest-path src-tauri/Cargo.toml --features cli --bin zhixing --target ${{ matrix.target }}
          bun scripts/prepare-cli.ts "${{ matrix.target }}"
          bun scripts/test-cli.ts "src-tauri/target/${{ matrix.target }}/release/zhixing${{ runner.os == 'Windows' && '.exe' || '' }}"

      - name: Build desktop installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tauriScript: bun run tauri
          args: >-
            --config src-tauri/tauri.desktop.conf.json --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
            ${{ github.event_name == 'pull_request' && '--config "{\"bundle\":{\"createUpdaterArtifacts\":false}}"' || '' }}

      - name: Stage platform packages
        run: bun scripts/stage-release.ts "${{ matrix.target }}"

      - name: Upload installers and updater bundles
        uses: actions/upload-artifact@v7
        with:
          name: zhixing-campus-${{ matrix.artifact }}-${{ github.run_number }}
          path: output/packages/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: Download platform installers
        uses: actions/download-artifact@v8
        with:
          pattern: zhixing-campus-*
          path: release
          merge-multiple: true

      - name: Upload installers and publish
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            prerelease=false
            if [[ "$RELEASE_TAG" == *-* ]]; then
              prerelease=true
            fi
            notes=(--generate-notes)
            if [[ -f "docs/releases/${RELEASE_TAG#v}.md" ]]; then
              notes=(--notes-file "docs/releases/${RELEASE_TAG#v}.md")
            fi
            gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease="$prerelease" "${notes[@]}" --title "知行 Campus $RELEASE_TAG"
          fi
          shopt -s globstar nullglob
          files=(release/*)
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
          release_id=$(gh release view "$RELEASE_TAG" --json databaseId --jq .databaseId)
          gh api "repos/$GH_REPO/releases/$release_id" > output-release.json
          bun scripts/update-manifest.ts output-release.json release release/latest.json
          gh release upload "$RELEASE_TAG" release/latest.json --clobber
          gh release edit "$RELEASE_TAG" --draft=false
