[tools]
node = "22.23.2"
bun = "1.4.3"
rust = "1.98.1"

[tasks.setup]
description = "安装项目依赖"
run = "bun install --frozen-lockfile"

[tasks.dev]
description = "启动 Tauri 桌面开发环境"
run = "bun run tauri dev"

[tasks.web]
description = "启动浏览器界面预览"
run = "bun run dev"

[tasks.check]
description = "检查 TypeScript"
run = "bun run check"

[tasks.test]
description = "运行前端与 Rust 单元测试"
run = ["bun run test", "cargo test --manifest-path src-tauri/Cargo.toml --lib"]

[tasks.build]
description = "构建当前平台安装包"
run = "bun run tauri build"

[tasks."build:app"]
description = "构建 macOS 应用"
run = "bun run tauri build --bundles app"

[tasks."test:live"]
description = "读取已保存凭据，逐项巡检真实只读接口并生成报告"
run = "bun scripts/test-live-api.ts"
